version: '3.8'

services:
  bot:
    build: .
    container_name: terabox_bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
      - ./bot.db:/app/bot.db
    ports:
      - "8080:8080"
    depends_on:
      - redis
    networks:
      - bot_network

  redis:
    image: redis:7-alpine
    container_name: terabox_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - bot_network

  nginx:
    image: nginx:alpine
    container_name: terabox_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - bot
    networks:
      - bot_network

networks:
  bot_network:
    driver: bridge

volumes:
  redis_data:
