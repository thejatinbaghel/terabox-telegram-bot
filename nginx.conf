events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Upstream to bot's temporary link server
    upstream bot_backend {
        server bot:8080;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 2048M;

        # Healthcheck endpoint
        location /health {
            proxy_pass http://bot_backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Temporary download link delivery
        location /d/ {
            proxy_pass http://bot_backend/d/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # HTTP Range headers support for chunked streaming and resumption
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_http_version 1.1;

            # Disable proxy buffering for instant media streaming
            proxy_buffering off;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
        }
    }
}
